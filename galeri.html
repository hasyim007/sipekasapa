<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri - SIPEKA SAPA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: '#F97316', 'primary-dark': '#EA580C', 'primary-light': '#FFEDD5',
                        navy: '#123B78', 'navy-light': '#1B4B8F', 'navy-dark': '#0C2A57',
                        surface: '#F8FAFC', success: '#16A34A', warning: '#F59E0B', danger: '#DC2626'
                    },
                    boxShadow: {
                        soft: '0 4px 24px -4px rgba(18,59,120,0.10), 0 2px 8px -2px rgba(18,59,120,0.06)',
                        glass: '0 8px 32px rgba(18,59,120,0.18)'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        #carousel-track {
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        #carousel-track::-webkit-scrollbar { display: none; }
        .carousel-slide { scroll-snap-align: center; }
    </style>
</head>
<body class="antialiased min-h-screen text-slate-800">

    <div class="min-h-screen flex flex-col fade-in relative">

        <!-- Navbar -->
        <nav class="glass-navbar sticky top-0 z-40 w-full py-3 sm:py-4 px-4 sm:px-6 flex justify-between items-center gap-2">
            <a href="index.html" class="flex items-center gap-2 sm:gap-3 min-w-0">
                <div class="w-9 h-9 sm:w-10 sm:h-10 shrink-0 bg-primary rounded-2xl flex items-center justify-center text-white font-bold shadow-soft overflow-hidden">
                    <i data-lucide="message-square-heart" id="navbar-logo-icon" class="w-5 h-5 sm:w-6 sm:h-6"></i>
                    <img id="navbar-logo-img" src="" class="w-full h-full object-cover hidden" alt="Logo">
                </div>
                <div class="min-w-0">
                    <h1 class="text-base sm:text-xl font-extrabold text-white leading-tight tracking-tight truncate">SIPEKA <span class="text-primary">SAPA</span></h1>
                    <p class="hidden sm:block text-[11px] text-white/60 font-medium">Sistem Pengaduan &amp; Konsultasi SDN 01 Papahan</p>
                </div>
            </a>
            <a href="index.html" class="text-white/80 hover:text-white font-semibold text-sm transition-colors flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> <span class="hidden sm:inline">Kembali</span>
            </a>
        </nav>

        <main class="flex-grow p-6 slide-up">
            <div class="max-w-5xl mx-auto">
                <div class="text-center mb-10">
                    <div class="inline-block px-4 py-1.5 rounded-full bg-primary-light text-primary-dark text-sm font-semibold mb-3">
                        Dokumentasi Sekolah
                    </div>
                    <h2 class="text-3xl md:text-4xl font-extrabold text-navy leading-tight">Galeri <span class="text-primary">Kegiatan</span></h2>
                    <p class="text-slate-500 mt-2">Momen dan kegiatan di SDN 01 Papahan.</p>
                </div>

                <div id="galeri-loading" class="text-center py-20 text-slate-400">
                    <div class="spinner mx-auto mb-3"></div>
                    Memuat galeri...
                </div>

                <div id="galeri-empty" class="glass-panel p-12 rounded-2xl text-center hidden">
                    <i data-lucide="image-off" class="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
                    <p class="text-slate-500 font-medium">Belum ada foto di galeri.</p>
                </div>

                <div id="carousel-wrapper" class="relative hidden">
                    <div id="carousel-track" class="flex gap-4 overflow-x-auto pb-4"></div>

                    <button onclick="carouselNav(-1)" class="hidden md:flex absolute left-[-20px] top-1/2 -translate-y-1/2 w-11 h-11 bg-white shadow-glass rounded-full items-center justify-center text-navy hover:bg-navy hover:text-white transition-colors">
                        <i data-lucide="chevron-left" class="w-5 h-5"></i>
                    </button>
                    <button onclick="carouselNav(1)" class="hidden md:flex absolute right-[-20px] top-1/2 -translate-y-1/2 w-11 h-11 bg-white shadow-glass rounded-full items-center justify-center text-navy hover:bg-navy hover:text-white transition-colors">
                        <i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </main>

        <footer class="py-6 text-center text-slate-500 text-sm">
            &copy; 2026 SIPEKA SAPA &mdash; SDN 01 Papahan. Hak Cipta Dilindungi.
        </footer>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script>
        lucide.createIcons();

        function carouselNav(dir) {
            const track = document.getElementById('carousel-track');
            const slide = track.querySelector('.carousel-slide');
            const step = slide ? slide.offsetWidth + 16 : 300;
            track.scrollBy({ left: dir * step, behavior: 'smooth' });
        }

        async function loadGaleri() {
            try {
                const result = await apiGet('listGaleri');
                document.getElementById('galeri-loading').classList.add('hidden');
                if (!result.success || !result.data.length) {
                    document.getElementById('galeri-empty').classList.remove('hidden');
                    return;
                }
                document.getElementById('carousel-wrapper').classList.remove('hidden');
                const track = document.getElementById('carousel-track');
                track.innerHTML = result.data.map(item => `
                    <div class="carousel-slide shrink-0 w-[280px] sm:w-[340px]">
                        <div class="glass-panel rounded-2xl overflow-hidden shadow-glass">
                            <img src="${item.imageBase64}" class="w-full h-64 object-cover">
                            ${item.caption ? `<div class="p-4"><p class="text-sm font-semibold text-navy">${item.caption}</p></div>` : ''}
                        </div>
                    </div>
                `).join('');

                const result2 = await apiGet('getConfig');
                if (result2.success && result2.data.logoWebsite) {
                    document.getElementById('navbar-logo-img').src = result2.data.logoWebsite;
                    document.getElementById('navbar-logo-img').classList.remove('hidden');
                    document.getElementById('navbar-logo-icon').classList.add('hidden');
                }
            } catch (err) {
                document.getElementById('galeri-loading').classList.add('hidden');
                document.getElementById('galeri-empty').classList.remove('hidden');
            }
        }

        loadGaleri();
    </script>
</body>
</html>

name = "sipekasapa"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Ganti "database_id" di bawah dengan ID yang muncul setelah Anda
# menjalankan: wrangler d1 create sipekasapa-db
[[d1_databases]]
binding = "DB"
database_name = "sipekasapa"
database_id = "dd1b1897-84ac-41a1-96cd-73a47ac3769b"

# Variabel non-rahasia (boleh diubah di sini). Untuk kredensial admin
# (ADMIN_USER, ADMIN_PASS) JANGAN ditaruh di file ini — gunakan
# `wrangler secret put ADMIN_USER` dan `wrangler secret put ADMIN_PASS`
# supaya tidak ikut ter-commit ke Git.
[vars]
# Isi dengan origin GitHub Pages Anda, contoh:
# "https://namauser.github.io"
# Boleh lebih dari satu, dipisah koma. Gunakan "*" hanya untuk uji coba awal.
ALLOWED_ORIGIN = "*"

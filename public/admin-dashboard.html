<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - SIPEKA SAPA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: '#F97316', 'primary-dark': '#EA580C', 'primary-light': '#FFEDD5',
                        navy: '#123B78', 'navy-light': '#1B4B8F', 'navy-dark': '#0C2A57',
                        surface: '#F8FAFC', success: '#16A34A', warning: '#F59E0B', danger: '#DC2626'
                    },
                    boxShadow: {
                        soft: '0 4px 24px -4px rgba(18,59,120,0.10), 0 2px 8px -2px rgba(18,59,120,0.06)',
                        glass: '0 8px 32px rgba(18,59,120,0.18)'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="antialiased text-slate-800">

    <div class="h-screen w-full flex flex-row bg-surface">
        <div id="admin-sidebar-container"></div>

        <main class="flex-1 min-w-0 h-full overflow-y-auto relative">
            <div class="pt-20 px-6 pb-6 md:p-8 max-w-7xl mx-auto">
                <div class="mb-8">
                    <h2 class="text-2xl font-bold text-navy">Dashboard Overview</h2>
                    <p class="text-slate-500">Ringkasan data konsultasi dan pengaduan terbaru.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="glass-panel p-6 rounded-2xl">
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-12 h-12 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center"><i data-lucide="inbox" class="w-6 h-6"></i></div>
                            <span class="text-xs font-bold text-slate-400 uppercase">Total Laporan</span>
                        </div>
                        <div class="text-3xl font-extrabold text-navy" id="stat-total">0</div>
                    </div>
                    <div class="glass-panel p-6 rounded-2xl border-l-4 border-primary">
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-12 h-12 rounded-full bg-primary-light text-primary-dark flex items-center justify-center"><i data-lucide="message-circle" class="w-6 h-6"></i></div>
                            <span class="text-xs font-bold text-primary-dark uppercase">Konsultasi</span>
                        </div>
                        <div class="text-3xl font-extrabold text-navy" id="stat-konsultasi">0</div>
                    </div>
                    <div class="glass-panel p-6 rounded-2xl border-l-4 border-navy">
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-12 h-12 rounded-full bg-navy/10 text-navy flex items-center justify-center"><i data-lucide="alert-octagon" class="w-6 h-6"></i></div>
                            <span class="text-xs font-bold text-navy uppercase">Pengaduan</span>
                        </div>
                        <div class="text-3xl font-extrabold text-navy" id="stat-pengaduan">0</div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 glass-panel p-6 rounded-2xl">
                        <h3 class="font-bold text-navy mb-4">Statistik Laporan</h3>
                        <div class="w-full h-64">
                            <canvas id="mainChart"></canvas>
                        </div>
                    </div>
                    <div class="glass-panel p-6 rounded-2xl flex flex-col">
                        <h3 class="font-bold text-navy mb-4">Aktivitas Terakhir</h3>
                        <div class="flex-grow overflow-y-auto space-y-4 pr-2" id="recent-activity-list"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast"></div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/common.js"></script>
    <script>
        requireAdminAuth();
        renderAdminSidebar('dashboard');

        let myChart = null;

        async function loadDashboard() {
            showPageLoading('Mengambil data dari server...');
            try {
                const result = await apiGet('listLaporan');
                hidePageLoading();
                if (!result.success) { showToast('Gagal', result.message, true); return; }

                const laporanData = result.data;
                const konsultasi = laporanData.filter(d => d.jenis === 'Konsultasi');
                const pengaduan = laporanData.filter(d => d.jenis === 'Pengaduan');

                document.getElementById('stat-total').innerText = laporanData.length;
                document.getElementById('stat-konsultasi').innerText = konsultasi.length;
                document.getElementById('stat-pengaduan').innerText = pengaduan.length;

                renderChart(konsultasi.length, pengaduan.length);
                renderRecentActivity(laporanData.slice(0, 5));
            } catch (err) {
                hidePageLoading();
                showToast('Gagal', err.message, true);
            }
        }

        function renderChart(konsultasi, pengaduan) {
            const ctx = document.getElementById('mainChart');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Konsultasi', 'Pengaduan'],
                    datasets: [{
                        data: [konsultasi || 0, pengaduan || 0],
                        backgroundColor: ['#F97316', '#123B78'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { font: { family: "'Plus Jakarta Sans', sans-serif", weight: '600' } } } },
                    cutout: '70%'
                }
            });
        }

        function renderRecentActivity(dataArr) {
            const container = document.getElementById('recent-activity-list');
            container.innerHTML = '';
            if (dataArr.length === 0) {
                container.innerHTML = `<div class="text-sm text-slate-500 italic">Belum ada aktivitas.</div>`;
                return;
            }
            dataArr.forEach(item => {
                const isKonsultasi = item.jenis === 'Konsultasi';
                const iconBg = isKonsultasi ? 'bg-primary-light text-primary-dark' : 'bg-navy/10 text-navy';
                const iconName = isKonsultasi ? 'message-circle' : 'alert-octagon';
                container.innerHTML += `
                    <div class="flex gap-3 border-b border-slate-100 pb-3 last:border-0">
                        <div class="flex-shrink-0 w-8 h-8 rounded-full ${iconBg} flex items-center justify-center">
                            <i data-lucide="${iconName}" class="w-4 h-4"></i>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-slate-800">${item.nama} mengirim ${item.jenis}</p>
                            <p class="text-xs text-slate-400">${formatDate(item.tanggal)}</p>
                        </div>
                    </div>`;
            });
            lucide.createIcons();
        }

        loadDashboard();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Foto - SIPEKA SAPA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: '#F97316', 'primary-dark': '#EA580C', 'primary-light': '#FFEDD5',
                        navy: '#123B78', 'navy-light': '#1B4B8F', 'navy-dark': '#0C2A57',
                        surface: '#F8FAFC', success: '#16A34A', warning: '#F59E0B', danger: '#DC2626'
                    },
                    boxShadow: {
                        soft: '0 4px 24px -4px rgba(18,59,120,0.10), 0 2px 8px -2px rgba(18,59,120,0.06)',
                        glass: '0 8px 32px rgba(18,59,120,0.18)'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="antialiased text-slate-800">

    <div class="h-screen w-full flex flex-row bg-surface">
        <div id="admin-sidebar-container"></div>

        <main class="flex-1 min-w-0 h-full overflow-y-auto relative">
            <div class="pt-20 px-6 pb-6 md:p-8 max-w-7xl mx-auto">
                <div class="mb-6 flex items-center justify-between flex-wrap gap-3">
                    <div>
                        <h2 class="text-2xl font-bold text-navy">Galeri Foto</h2>
                        <p class="text-slate-500">Foto yang diunggah di sini akan tampil di carousel galeri publik.</p>
                    </div>
                    <button onclick="openUploadModal()" class="bg-primary hover:bg-primary-dark text-white px-5 py-2.5 rounded-xl font-bold transition-all shadow-soft flex items-center gap-2">
                        <i data-lucide="upload" class="w-4 h-4"></i> Unggah Foto
                    </button>
                </div>

                <div id="galeri-empty" class="glass-panel p-12 rounded-2xl text-center hidden">
                    <i data-lucide="image-off" class="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
                    <p class="text-slate-500 font-medium">Belum ada foto di galeri.</p>
                    <p class="text-slate-400 text-sm">Klik "Unggah Foto" untuk menambahkan foto pertama.</p>
                </div>

                <div id="galeri-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
            </div>
        </main>
    </div>

    <!-- Modal Upload -->
    <div id="uploadModal" class="fixed inset-0 z-[150] hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-navy-dark/50 backdrop-blur-sm" onclick="closeUploadModal()"></div>
        <div class="glass-panel relative z-10 w-full max-w-md p-6 rounded-2xl shadow-glass">
            <h3 class="font-bold text-navy text-lg mb-4 flex items-center gap-2">
                <i data-lucide="upload" class="w-5 h-5 text-primary"></i> Unggah Foto Galeri
            </h3>
            <form id="uploadForm" onsubmit="submitUpload(event)" class="space-y-4">
                <div>
                    <label class="text-xs font-semibold text-slate-700">Pilih Foto (Maks ~150KB, disimpan di database)</label>
                    <input type="file" id="upload-file" accept="image/*" required class="w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-primary-light file:text-primary-dark hover:file:bg-orange-200 mt-1 cursor-pointer">
                    <div id="upload-preview-container" class="mt-3 hidden">
                        <img id="upload-preview" src="" class="w-full h-40 object-cover rounded-xl border">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-700">Keterangan Foto (opsional)</label>
                    <input type="text" id="upload-caption" placeholder="mis. Kegiatan Upacara Bendera" class="w-full px-3 py-2 mt-1 rounded-lg border border-slate-200 text-sm focus:ring-2 focus:ring-primary outline-none">
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeUploadModal()" class="flex-1 py-2.5 rounded-xl font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">Batal</button>
                    <button type="submit" id="uploadBtn" class="flex-1 bg-primary hover:bg-primary-dark text-white py-2.5 rounded-xl font-bold transition-all shadow-soft flex justify-center items-center gap-2">
                        <i data-lucide="check" class="w-4 h-4"></i> Unggah
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast"></div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/common.js"></script>
    <script>
        requireAdminAuth();
        renderAdminSidebar('galeri');

        let uploadImageBase64 = '';

        function openUploadModal() {
            document.getElementById('uploadModal').classList.remove('hidden');
            document.getElementById('uploadModal').classList.add('flex');
        }
        function closeUploadModal() {
            document.getElementById('uploadModal').classList.add('hidden');
            document.getElementById('uploadModal').classList.remove('flex');
            document.getElementById('uploadForm').reset();
            document.getElementById('upload-preview-container').classList.add('hidden');
            uploadImageBase64 = '';
        }

        document.getElementById('upload-file').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 200000) {
                showToast('Terlalu Besar', 'Ukuran foto sebaiknya di bawah ~150KB agar tersimpan optimal di database. Kompres foto Anda terlebih dahulu.', true);
            }
            const reader = new FileReader();
            reader.onload = function (event) {
                uploadImageBase64 = event.target.result;
                document.getElementById('upload-preview-container').classList.remove('hidden');
                document.getElementById('upload-preview').src = uploadImageBase64;
            };
            reader.readAsDataURL(file);
        });

        async function submitUpload(e) {
            e.preventDefault();
            if (!uploadImageBase64) {
                showToast('Gagal', 'Pilih foto terlebih dahulu.', true);
                return;
            }
            const btn = document.getElementById('uploadBtn');
            btn.disabled = true;
            btn.innerText = 'Mengunggah...';
            try {
                const result = await apiPost('addGaleri', {
                    imageBase64: uploadImageBase64,
                    caption: document.getElementById('upload-caption').value
                });
                if (result.success) {
                    showToast('Berhasil', 'Foto berhasil ditambahkan ke galeri.');
                    closeUploadModal();
                    loadGaleri();
                } else {
                    showToast('Gagal', result.message, true);
                }
            } catch (err) {
                showToast('Gagal', err.message, true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Unggah';
                lucide.createIcons();
            }
        }

        async function deleteGaleriItem(id) {
            if (!confirm('Hapus foto ini dari galeri?')) return;
            try {
                const result = await apiPost('deleteGaleri', { id });
                if (result.success) {
                    showToast('Terhapus', 'Foto berhasil dihapus.');
                    loadGaleri();
                } else {
                    showToast('Gagal', result.message, true);
                }
            } catch (err) {
                showToast('Gagal', err.message, true);
            }
        }

        async function loadGaleri() {
            showPageLoading('Mengambil galeri...');
            try {
                const result = await apiGet('listGaleri');
                hidePageLoading();
                if (!result.success) {
                    showToast('Gagal', result.message, true);
                    return;
                }
                const grid = document.getElementById('galeri-grid');
                const empty = document.getElementById('galeri-empty');
                if (!result.data.length) {
                    grid.innerHTML = '';
                    empty.classList.remove('hidden');
                    return;
                }
                empty.classList.add('hidden');
                grid.innerHTML = result.data.map(item => `
                    <div class="glass-panel rounded-2xl overflow-hidden group relative">
                        <img src="${item.imageBase64}" class="w-full h-40 object-cover">
                        <div class="p-3">
                            <p class="text-xs text-slate-600 truncate">${item.caption || '<i>Tanpa keterangan</i>'}</p>
                        </div>
                        <button onclick="deleteGaleriItem('${item.id}')" class="absolute top-2 right-2 w-8 h-8 bg-white/90 hover:bg-danger hover:text-white text-danger rounded-full flex items-center justify-center shadow-soft transition-colors opacity-0 group-hover:opacity-100">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `).join('');
                lucide.createIcons();
            } catch (err) {
                hidePageLoading();
                showToast('Gagal', err.message, true);
            }
        }

        loadGaleri();
    </script>
</body>
</html>
